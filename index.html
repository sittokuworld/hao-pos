<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>物販レジ</title>
<style>
:root{--bg:#f4f4f2;--fg:#1a1a1a;--card:#fff;--ac:#1a1a1a;--mute:#777;--ok:#1b8a4b;--ng:#c33;--line:#ddd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--ac);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
header b{font-size:18px}
#stat{font-size:12px;padding:3px 8px;border-radius:10px;background:#fff3;}
#stat.warn{background:#e9a100}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line)}
nav button{flex:1;padding:12px;border:0;background:none;font-size:15px;color:var(--mute)}
nav button.on{color:var(--fg);font-weight:700;border-bottom:3px solid var(--fg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 10px;min-height:92px;text-align:center;font-size:15px;font-weight:600;display:flex;flex-direction:column;justify-content:center;gap:6px}
.item span{font-weight:400;color:var(--mute);font-size:14px}
.item:active{background:#e8e8e8}
.sum{margin:12px;background:var(--card);border-radius:12px;padding:14px;font-size:15px}
.sum .big{font-size:28px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);font-size:14px}
.row.c{opacity:.45;text-decoration:line-through}
.row.neg{color:var(--ng)}
.row small{color:var(--mute);display:block}
.row button{border:1px solid var(--ng);color:var(--ng);background:none;border-radius:8px;padding:6px 10px;font-size:13px}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:10}
#modal.on{display:flex}
.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 4px;font-size:20px}
.qty{display:flex;align-items:center;justify-content:center;gap:24px;margin:16px 0}
.qty button{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:32px}
.qty output{font-size:44px;font-weight:700;min-width:70px;text-align:center}
.total{text-align:center;font-size:30px;font-weight:700;margin-bottom:12px}
.pay{display:flex;gap:8px;margin-bottom:14px}
.pay button{flex:1;padding:14px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:16px}
.pay button.on{border-color:var(--fg);background:var(--fg);color:#fff}
.act{display:flex;gap:8px}
.act button{padding:16px;border-radius:12px;border:0;font-size:18px;font-weight:700}
#cancel{flex:1;background:#eee}
#ok{flex:2;background:var(--ok);color:#fff}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
.hide{display:none}
</style>
</head>
<body>
<header><b>物販レジ</b><span id="stat">準備中</span></header>
<nav><button id="t1" class="on">レジ</button><button id="t2">履歴・取消</button></nav>

<section id="v1">
  <div class="sum">本日の売上<div class="big" id="sumTop">¥0</div></div>
  <div class="grid" id="grid"></div>
</section>

<section id="v2" class="hide">
  <div class="sum">
    売上合計 <span class="big" id="sumAll">¥0</span><br>
    現金 <span id="sumCash">¥0</span> ／ PayPay <span id="sumPP">¥0</span>
  </div>
  <div id="hist"></div>
</section>

<div id="modal"><div class="sheet">
  <h2 id="mName"></h2>
  <div style="color:#777" id="mPrice"></div>
  <div class="qty"><button id="minus">−</button><output id="mQty">1</output><button id="plus">＋</button></div>
  <div class="total" id="mTotal"></div>
  <div class="pay"><button data-p="現金" class="on">現金</button><button data-p="PayPay">PayPay</button></div>
  <div class="act"><button id="cancel">戻る</button><button id="ok">確定</button></div>
</div></div>
<div id="toast"></div>

<script>
// ===== 設定 =====
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzq0VcyOdUtwkysu0qVEBqkQdHEfBHzyIVhEetI6obTe2c2Ro61wT4gX_o-Ea7U8dglpA/exec';
const TOKEN   = 'HΛO';   // gas/Code.gs の TOKEN と同じ文字列
const PRODUCTS = [
  {name:'yet, vol.3', price:1500},
  {name:'yet, vol.2', price:1500},
  {name:'gap vol.2', price:1000},
  {name:'独白', price:2000},
  {name:'瞳の奥で', price:2500},
  {name:'境界が曖昧になる時', price:2000},
  {name:'衝突', price:1000},
  {name:'HΛOステッカー', price:300},
  {name:'HΛOTシャツ', price:3000},
  {name:'HΛO手ぬぐい', price:1000},
  {name:'HΛO大仏', price:1000},
  {name:'ガチャガチャ', price:1000},
];

// ===== 状態（端末に保存） =====
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let log=load('hao_log',[]);      // 全記録（履歴表示用）
let queue=load('hao_queue',[]);  // 未送信
let cur=null,qty=1,pay='現金',sending=false;

const $=id=>document.getElementById(id);
const yen=n=>(n<0?'-':'')+'¥'+Math.abs(n).toLocaleString();
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

// ===== 画面 =====
$('grid').innerHTML=PRODUCTS.map((p,i)=>`<button class="item" data-i="${i}">${p.name}<span>${yen(p.price)}</span></button>`).join('');
$('grid').onclick=e=>{const b=e.target.closest('.item');if(b)openModal(PRODUCTS[b.dataset.i])};
function openModal(p){cur=p;qty=1;pay='現金';$('mName').textContent=p.name;$('mPrice').textContent='単価 '+yen(p.price);
  document.querySelectorAll('.pay button').forEach(b=>b.classList.toggle('on',b.dataset.p===pay));upd();$('modal').classList.add('on')}
function upd(){$('mQty').textContent=qty;$('mTotal').textContent=yen(cur.price*qty)}
$('minus').onclick=()=>{if(qty>1){qty--;upd()}};
$('plus').onclick=()=>{qty++;upd()};
document.querySelector('.pay').onclick=e=>{const b=e.target.closest('button');if(!b)return;pay=b.dataset.p;
  document.querySelectorAll('.pay button').forEach(x=>x.classList.toggle('on',x===b))};
$('cancel').onclick=()=>$('modal').classList.remove('on');
$('ok').onclick=()=>{
  record({id:uid(),ts:new Date().toISOString(),product:cur.name,qty,unit:cur.price,amount:cur.price*qty,pay,type:'販売',ref:''});
  $('modal').classList.remove('on');toast(`${cur.name} ×${qty}  ${yen(cur.price*qty)} 記録しました`);
};
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
function tab(n){$('v1').classList.toggle('hide',n!==1);$('v2').classList.toggle('hide',n!==2);
  $('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2);render()}

function record(r){log.push(r);queue.push(r);save('hao_log',log);save('hao_queue',queue);render();flush()}

function render(){
  const total=log.reduce((s,r)=>s+r.amount,0);
  const by=p=>log.filter(r=>r.pay===p).reduce((s,r)=>s+r.amount,0);
  $('sumTop').textContent=$('sumAll').textContent=yen(total);
  $('sumCash').textContent=yen(by('現金'));$('sumPP').textContent=yen(by('PayPay'));
  const cancelled=new Set(log.filter(r=>r.type==='取消').map(r=>r.ref));
  $('hist').innerHTML=log.slice().reverse().map(r=>{
    const t=new Date(r.ts).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    const c=cancelled.has(r.id);
    return `<div class="row ${c?'c':''} ${r.type==='取消'?'neg':''}"><div>${r.product} ×${r.qty}<small>${t} ・ ${r.pay}${r.type==='取消'?' ・取消':''}</small></div>
      <div>${yen(r.amount)} ${r.type==='販売'&&!c?`<button data-id="${r.id}">取消</button>`:''}</div></div>`}).join('')||'<div class="row">まだ記録がありません</div>';
  const n=queue.length;$('stat').textContent=n?`未送信 ${n}件`:'送信済み ✓';$('stat').classList.toggle('warn',!!n);
}
$('hist').onclick=e=>{const b=e.target.closest('button[data-id]');if(!b)return;
  const o=log.find(r=>r.id===b.dataset.id);
  if(!o||!confirm(`取り消しますか？\n${o.product} ×${o.qty}  ${yen(o.amount)}`))return;
  record({id:uid(),ts:new Date().toISOString(),product:o.product,qty:-o.qty,unit:o.unit,amount:-o.amount,pay:o.pay,type:'取消',ref:o.id});
  toast('取り消しました')};

// ===== 送信（失敗したら端末に残して再試行） =====
async function flush(){
  if(sending||!queue.length||!GAS_URL)return;
  sending=true;
  try{
    while(queue.length){
      const r=queue[0];
      const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...r,token:TOKEN})});
      const j=await res.json();
      if(!j.ok)throw new Error(j.error||'ng');
      queue.shift();save('hao_queue',queue);render();
    }
  }catch(e){/* 次回再試行 */}
  sending=false;
}
window.addEventListener('online',flush);
setInterval(flush,15000);
render();flush();
if(!GAS_URL)$('stat').textContent='URL未設定';
</script>
</body>
</html>
